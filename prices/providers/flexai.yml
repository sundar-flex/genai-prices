# yaml-language-server: $schema=.schema.json
id: flexai
name: FlexAI
description: OpenAI-compatible inference for open-weight models served on FlexAI's own GPU clusters.
pricing_urls:
  - https://flex.ai/pricing
  - https://api.flex.ai/v1/models
api_pattern: 'https://(?:tokens|api)\.flex\.ai(?:/|$)'
price_comments: >-
  Covers every token-priced model in the FlexAI catalog: the text-generation models plus the BGE-M3 embedding model.
  Prices come from the `pricing` block of `GET https://api.flex.ai/v1/models` (authenticated) and match the public pricing
  page. Image, speech-to-text and text-to-speech models are omitted because they are billed per image or per minute,
  not per token. Model IDs are bare FlexAI serving names, so they do not infer the FlexAI provider without a FlexAI
  provider ID or API URL. `tokens.flex.ai` is a legacy host that still serves the same API.

# FlexAI returns an OpenAI-compatible response with standard model and usage fields.
extractors:
  - api_flavor: default
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [completion_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

  - api_flavor: chat
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens
      - path: [prompt_tokens_details, cached_tokens]
        dest: cache_read_tokens
        required: false
      - path: [completion_tokens_details, reasoning_tokens]
        dest: output_reasoning_tokens
        required: false
      - path: completion_tokens
        dest: output_tokens

  - api_flavor: embeddings
    root: usage
    mappings:
      - path: prompt_tokens
        dest: input_tokens

